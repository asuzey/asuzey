name: snake

# Runs on a timer only. The activity workflow commits to main every half hour,
# so triggering on push would redraw the snake far more often than it changes.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Draw the contribution snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#6FB8FF&color_dots=#0C1428,#1E3A5F,#3E7BB8,#6FB8FF,#7FE7DF
            dist/snake-light.svg?palette=github-light&color_snake=#2F7FE8

      # The generated SVGs live on their own branch so the profile history stays
      # clean; the README points straight at raw.githubusercontent.
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
