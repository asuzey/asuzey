name: snake

# A push trigger is safe here: commits pushed by a workflow using GITHUB_TOKEN
# do not start further workflow runs, so the profile job's own commits cannot
# put this into a loop.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Draw the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake/dark.svg?palette=github-dark&color_snake=#6FB8FF&color_dots=#0C1428,#1E3A5F,#3E7BB8,#6FB8FF,#7FE7DF
            assets/snake/light.svg?palette=github-light&color_snake=#2F7FE8

      # The drawings are committed straight to main rather than published to a
      # separate branch by a third-party action. One less moving part, and the
      # README can use a relative path like every other asset here.
      - name: Commit the drawing
        run: |
          if [ -z "$(git status --porcelain assets/snake)" ]; then
            echo "snake unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake
          git commit -m "chore: redraw the contribution snake"
          git push
