name: profile

# Redraws the stats card and rewrites the recent-activity list. Both are
# generated in this repo rather than fetched from a third-party image service,
# so the profile can never show a broken card because someone else's server is
# rate limited.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

# One run at a time. Overlapping runs used to race each other on git push.
concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Neither step is allowed to fail the job. A transient API hiccup should
      # leave the previous card in place, not turn the profile red and block
      # the other step from running.
      - name: Redraw the stats card
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Rewrite the recent-activity list
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_activity.py

      - name: Commit only if something actually changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats
          git commit -m "chore: refresh profile stats and activity"
          git push
