name: profile

# Everything the profile regenerates lives in this one workflow: the snake, the
# stats card and the recent-activity list. They were split across two files,
# and only the snake's schedule ever fired -- the stats card sat untouched for
# a month while the snake redrew daily, so the follower and contribution
# figures on the profile were stale. Sharing a schedule that demonstrably
# works is worth more than keeping the jobs separate.
on:
  schedule:
    # This exact shape has fired every single day on this repo.
    - cron: "0 3 * * *"
    # An hourly attempt on top. GitHub drops short-interval schedules under
    # load, so this is a bonus rather than something to rely on.
    - cron: "17 * * * *"
  workflow_dispatch:
  # The dependable one: a push refreshes everything immediately.
  push:
    branches:
      - main

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No step may fail the job. If one source is having a bad day the others
      # still refresh, and the previous version of the failed one stays put.
      - name: Draw the contribution snake
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake/dark.svg?palette=github-dark&color_snake=#6FB8FF&color_dots=#0C1428,#1E3A5F,#3E7BB8,#6FB8FF,#7FE7DF
            assets/snake/light.svg?palette=github-light&color_snake=#2F7FE8

      - name: Redraw the stats card
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Redraw the contribution heatmap
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_graph.py

      - name: Rewrite the recent-activity list
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_activity.py

      - name: Commit only if something actually changed
        run: |
          if [ -z "$(git status --porcelain README.md assets/stats assets/graph assets/snake)" ]; then
            echo "nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats assets/graph assets/snake
          git commit -m "chore: refresh the profile"
          git push
